<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Поездка</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Поездка">
<meta name="theme-color" content="#ff7a59">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<style>
:root{
  --fb-bg:#ffffff; --fb-bg2:#f3f2f7; --fb-text:#15141a; --fb-hint:#86858f; --fb-link:#5b5bf0; --fb-btn:#5b5bf0; --fb-btn-text:#fff;
  --card:var(--tg-theme-bg-color,var(--fb-bg));
  --bg2:var(--tg-theme-secondary-bg-color,var(--fb-bg2));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --link:var(--tg-theme-link-color,var(--fb-link));
  --btn:var(--tg-theme-button-color,var(--fb-btn));
  --btn-text:var(--tg-theme-button-text-color,var(--fb-btn-text));
  --line:color-mix(in srgb,var(--hint) 22%,transparent);
  --soft:color-mix(in srgb,var(--hint) 12%,transparent);
  --shadow:0 1px 2px rgba(20,20,40,.05),0 4px 16px rgba(20,20,40,.06);
  --warn:#f0640f; --ok:#1f9d55; --red:#e5484d;
  --g1:#ff7a59; --g2:#ff4f8b; --g3:#7b5cff;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{--fb-bg:#1b1a21; --fb-bg2:#111015; --fb-text:#f3f2f7; --fb-hint:#8e8c99; --fb-link:#8f8cff; --fb-btn:#7b78ff; --shadow:none}
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--bg2);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g3));color:#fff;padding:12px 16px 12px;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-top{display:flex;align-items:flex-start;gap:10px;position:relative;z-index:1}
.hero h1{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.hero .sub{opacity:.9;font-size:13.5px;margin-top:3px}
.me-btn{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;font-weight:600;backdrop-filter:blur(6px);white-space:nowrap}
.me-btn.inv{margin-left:auto;padding:4px 9px;font-size:16px}.me-btn.inv+.me-btn{margin-left:0}
body.homing .hero,body.homing main,body.homing nav,body.homing #fab{display:none!important}
#home{padding:28px 16px 60px;max-width:560px;margin:0 auto}
.hh{text-align:center;margin:10px 0 22px}.hh .lg{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g3));box-shadow:var(--shadow)}
.hh h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}.hh p{margin:0;color:var(--hint);font-size:14.5px;line-height:1.4}
.tripc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow);color:var(--text);font:inherit}
.tripc .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft);flex:none}
.tripc b{display:block;font-size:16px}.tripc .x{margin-left:auto}
.lnk{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all;margin:10px 0;user-select:all}
.jl{display:flex;gap:8px}.jl input{flex:1;min-width:0;height:46px;border-radius:14px;border:0;background:var(--card);color:var(--text);padding:0 14px;font-size:15px;box-shadow:var(--shadow)}.jl .btn{flex:none;padding:0 18px}
.banner.off{background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--text)}
.warnc{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);margin-bottom:14px}
.me-btn .av{width:28px;height:28px;font-size:13px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.hero-row{display:flex;align-items:center;gap:12px;margin-top:10px;position:relative;z-index:1}
.ready{position:relative;z-index:1;margin-top:0;font-size:12px;display:flex;justify-content:space-between;opacity:.95}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:6px;margin-top:5px;overflow:hidden;position:relative;z-index:1}
.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s}
.seg-hero{flex:none;display:flex;background:rgba(0,0,0,.15);border-radius:11px;padding:3px;margin-top:0;position:relative;z-index:1}
.seg-hero button{flex:1;border:0;background:none;color:#fff;padding:5px 12px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:.85}
.seg-hero button.on{background:#fff;color:#2a2340;opacity:1}
main{padding:12px 12px 160px}
.tab{display:none}.tab.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:0 10px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:520px;margin:0 auto;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:5px}
nav button{flex:1;background:none;border:0;padding:6px 0 5px;font-size:10.5px;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:16px;font-weight:600}
nav button b{font-size:20px;font-weight:400;line-height:1.15;filter:grayscale(1);opacity:.75}
nav button.active{color:var(--btn);background:color-mix(in srgb,var(--btn) 12%,transparent)}
nav button.active b{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;font-size:28px;line-height:1;box-shadow:0 8px 20px rgba(123,92,255,.4)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.tap{cursor:pointer;transition:transform .12s}.tap:active{transform:scale(.985)}
.muted{color:var(--hint);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.h2 button{background:none;border:0;color:var(--link);font-size:13px;text-transform:none;letter-spacing:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rsch{background:var(--soft);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.rsch .ln3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:14px}
.rsch .nd{background:var(--card);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow)}
.rsch .nd.me{background:var(--link);color:#fff}
.rsch .ar{color:var(--hint)}
.rsch .sub{font-size:12px;color:var(--hint);margin-top:6px}
.rsch .pp{margin:8px 0 0}
.rsch .pk{border:0;font:inherit;font-weight:600;color:var(--text);cursor:pointer;outline:1.5px dashed color-mix(in srgb,var(--link) 55%,transparent);outline-offset:-1.5px}
.rsch .pk::after{content:' ▾';color:var(--hint);font-size:11px}
.rsch .pkl{margin-top:8px}.rsch .pkl .chips{margin-top:6px}.rsch .pkl .chip{background:var(--card)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px}
.hscroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border:0;border-radius:999px;padding:6px 11px;font-size:13px;color:var(--text);white-space:nowrap;font-weight:500}
.hscroll .chip{background:var(--card);box-shadow:var(--shadow)}
.chip.link{color:var(--link)}
.chip.on{background:var(--text)!important;color:var(--card)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:8px;padding:2px 8px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.badge.mute{background:var(--soft);color:var(--hint)}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;font-weight:600}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;font-size:14px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.empty{color:var(--hint);text-align:center;padding:36px 16px;font-size:14px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.pre{white-space:pre-wrap;word-break:break-word}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;background:var(--c,#999)}
.avs{display:inline-flex}.avs .av{box-shadow:0 0 0 2px var(--card);margin-left:-6px}.avs .av:first-child{margin-left:0}
.who-all{font-size:12px;color:var(--hint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);border:0;text-align:left}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--hint)}
.jr{position:relative;padding-left:44px;margin-top:6px}
.jr::before{content:"";position:absolute;left:19px;top:14px;bottom:30px;width:3px;border-radius:3px;background:linear-gradient(var(--g1),var(--g2),var(--g3));opacity:.55}
.jr>*{position:relative}
.node{background:var(--card);border-radius:var(--r);padding:12px 14px;margin:2px 0;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.node::before{content:"";position:absolute;left:-33px;top:15px;width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg2),0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent)}
.node-h{display:flex;align-items:baseline;gap:8px}
.node-h b{font-size:18px;letter-spacing:-.01em}
.node-h .n{margin-left:auto;font-size:12.5px;color:var(--hint);white-space:nowrap}
.node-d{font-size:13px;color:var(--hint);margin:1px 0 8px}
.node .chips .chip{font-size:12.5px;padding:4px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.node.home{border-left-color:var(--hint);padding:9px 14px}
.node.home::before{background:var(--hint)}
.leg{margin:12px 0 14px;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid var(--line)}
.leg .ic{position:absolute;left:-40px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:15px;box-shadow:0 0 0 3px var(--bg2),var(--shadow);z-index:1}
.leg::after{content:"";position:absolute;left:-29px;bottom:-15px;border:5px solid transparent;border-top:7px solid color-mix(in srgb,var(--g2) 70%,transparent)}
.leg .t{font-weight:600;font-size:14px}
.leg .s{font-size:12.5px;color:var(--hint);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:1px}
.leg.gap{border-style:dashed;border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn);background:none;font-size:13.5px;font-weight:600}
.leg.other{opacity:.55}
sup{font-size:10px;color:var(--warn);font-weight:700}
.day{background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.day.today{box-shadow:0 0 0 2px var(--btn)}
.day.past{opacity:.55}
.day-h{display:flex;align-items:center;gap:10px;padding:11px 14px 8px}
.dnum{width:42px;text-align:center;flex:none;line-height:1.05}
.dnum b{display:block;font-size:20px}.dnum span{font-size:10.5px;color:var(--hint);text-transform:uppercase}
.day-city{flex:1;font-weight:600}
.day-city .muted{font-weight:400}
.ev{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.ev .t{color:var(--hint);font-size:13px;width:42px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.ev .ic{font-size:18px;width:24px;text-align:center;flex:none}
.ev .grow>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.night{padding:8px 14px 10px 66px;border-top:1px solid var(--line);font-size:13px;color:var(--hint)}
.night.warn{color:var(--warn);cursor:pointer}
.pass{padding:0;overflow:hidden}
.pass-top{padding:13px 14px 10px}
.pass-route{display:flex;align-items:center;gap:10px;margin-top:6px}
.pass-route .pt{min-width:0;max-width:42%}
.pass-route .pt b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pass-route .pt span{display:block;font-size:12.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass-route .pt.r{text-align:right;margin-left:auto}
.pass-route .mid{flex:1;display:flex;align-items:center;gap:4px;color:var(--hint);font-size:16px;min-width:40px}
.pass-route .mid i{flex:1;height:0;border-top:2px dashed var(--line)}
.pass-bot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:2px dashed var(--line);background:color-mix(in srgb,var(--soft) 50%,transparent);flex-wrap:wrap}
.pass .meta{font-size:12.5px;color:var(--hint)}
.stay{border-top:4px solid var(--c)}
.opt{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.opts{margin-top:10px}
.place{display:flex;gap:12px;align-items:flex-start}
.place .pi{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.place.done h3{text-decoration:line-through;color:var(--hint)}
.place h3,.stay h3{margin:0;font-size:16px}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;font-size:14px;color:#fff;flex:none;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
#map{height:calc(100dvh - 330px);min-height:320px;border-radius:var(--r);overflow:hidden;position:relative;z-index:0;box-shadow:var(--shadow)}
.pin{font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.arrow{color:#ff4f8b;font-size:18px;font-weight:900;line-height:1;text-shadow:0 0 3px #fff}
.composer{background:var(--card);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);margin-bottom:12px}
.composer textarea{border:0;background:none;min-height:46px;padding:4px 6px;resize:none}
.composer .row{gap:6px;margin-top:4px}
.composer select{width:auto;flex:1;padding:7px 9px;font-size:14px}
.note{display:flex;gap:10px}
.note .av{width:34px;height:34px;font-size:14px}
.note .nh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.note .nh b{font-size:14.5px}
.note .txt{margin-top:2px}
.lnk{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--soft);color:var(--text);min-width:0}
.lnk .fav{width:28px;height:28px;border-radius:8px;background:var(--card);display:grid;place-items:center;flex:none;overflow:hidden}
.lnk .fav img{width:18px;height:18px}
.lnk .lt{min-width:0}.lnk .lt b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .lt span{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.todo:last-child{border:0}
.todo.done .grow{text-decoration:line-through;color:var(--hint)}
.x{background:none;border:0;color:var(--hint);font-size:20px;padding:0 4px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:50;display:none;backdrop-filter:blur(2px);opacity:0;transition:opacity .25s}
.sheet-bg.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;will-change:transform}
.sheet.open{transform:none}
.sheet.dragging{transition:none}
.grabz{flex:none;padding:8px 0 8px;touch-action:none;cursor:grab}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-in{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(22px + env(safe-area-inset-bottom))}
#sheetFoot{flex:none}#sheetFoot:empty{display:none}
[hidden]{display:none!important}
.pbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:32;max-width:496px;margin:0 auto;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 8px 28px rgba(0,0,0,.3);border:1.5px solid var(--btn)}
.pbar span{flex:1;font-weight:600;font-size:14px;line-height:1.2}.pbar .btn{flex:0 0 auto;padding:10px 14px}
.tgb{position:relative}.tgb::before{content:"";position:absolute;inset:-7px -3px}
.tgb.pend{box-shadow:0 0 0 2px var(--btn);opacity:1}
.tgb.pend::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--btn);box-shadow:0 0 0 2px var(--card)}
.tgn{display:block;text-align:center;font-size:11px;color:var(--hint);white-space:nowrap}
.pc.pend{border:1.5px solid var(--btn);background:color-mix(in srgb,var(--btn) 12%,transparent);cursor:pointer}
.sx .pendn{color:var(--btn);font-weight:600;font-size:12.5px}
.bhd,.brow{display:grid;grid-template-columns:38px minmax(0,1fr) 54px 42px 10px;gap:5px;align-items:center;padding:0 4px}
.bhd{padding-bottom:4px;font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em}.bhd span:nth-child(n+3){text-align:center}
.brow{min-height:34px;border-bottom:1px solid var(--line);cursor:pointer}
.brow.open{background:var(--soft);border-radius:10px 10px 0 0}
.brow:not(.gap):active{background:var(--soft)}
.bchev{display:inline-block;width:7px;height:7px;border-right:2px solid var(--link);border-bottom:2px solid var(--link);transform:rotate(-45deg);justify-self:center;transition:transform .18s;opacity:.8}
.brow.open .bchev{transform:translateY(-2px) rotate(45deg);opacity:1}
.bhint{display:flex;align-items:center;gap:8px;color:var(--link);background:color-mix(in srgb,var(--link) 9%,transparent);border-radius:8px;padding:4px 8px;margin:0 0 4px}
.bhint .bchev{flex:none;margin-left:2px}
.brow.past{opacity:.5}
.brow .sd{font-size:12.5px;color:var(--hint);font-variant-numeric:tabular-nums;line-height:1.1}
.brow .sd small{display:block;font-size:10px;opacity:.85}
.brow .sn{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.gap .sn{color:var(--hint)}
.brow>span:nth-child(3){text-align:center;white-space:nowrap;overflow:hidden}
.brow .spp{margin-left:0}
.badd{padding:4px 10px;font-size:12.5px}
.ball{font-size:11.5px;color:var(--hint)}

<script type="module">
const CFG = window.TRIP_CONFIG || {};
const tg = window.Telegram?.WebApp;
const inTG = !!(tg && tg.initData);
if (inTG) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes?.(); tg.setHeaderColor?.('#ff7a59'); } catch {} }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const toD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => key(new Date());
const fmtD = s => { if (!s) return ''; const d = toD(s.slice(0,10)); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDW = s => { if (!s) return ''; const d = toD(s.slice(0,10)); return `${d.getDate()} ${MON[d.getMonth()]}, ${WD[d.getDay()]}`; };
const fmtT = s => (s && s.length > 11) ? s.slice(11,16) : '';
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return key(d); };
const list = sec => Object.entries(data[sec] || {}).map(([id, v]) => ({ ...v, id }));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };
const nights = n => `${n} ${plural(n,'ночь','ночи','ночей')}`;
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a class="ext" href="$1" target="_blank" rel="noopener">$1</a>');
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return 'ссылка'; } };
function ago(t) { if (!t) return ''; const s = (Date.now() - t) / 1000; if (s < 60) return 'только что'; if (s < 3600) return Math.floor(s/60) + ' мин'; if (s < 86400) return Math.floor(s/3600) + ' ч'; if (s < 7*86400) return Math.floor(s/86400) + ' дн'; const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]}`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1700); }
function haptic(type = 'light') { try { tg?.HapticFeedback?.impactOccurred(type); } catch {} }
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* ---------------- какая поездка открыта ---------------- */
// Поездку открывает секретная ссылка: ?t=<id> в браузере или t.me/<бот>?startapp=<id> в Telegram.
// id длинный и случайный, список поездок в базе не читается, поэтому чужую поездку не найти.
const TRIP_RE = /^[A-Za-z0-9_-]{16,64}$/;
const BOT = CFG.bot || '';
const qs = new URLSearchParams(location.search);
const cloud = inTG && tg.isVersionAtLeast?.('6.9') ? tg.CloudStorage : null;
function pickTrip() {
  if (qs.has('home')) return '';
  const c = [qs.get('t'), tg?.initDataUnsafe?.start_param].find(x => x && TRIP_RE.test(x));
  if (c) return c;
  if (!CFG.firebase && CFG.tripId) return CFG.tripId; // локальный режим без базы
  const last = ls.get('trip-last'); return last && TRIP_RE.test(last) ? last : '';
}
const TRIP = pickTrip();
const FILE_Q = /^[a-z0-9]{6,24}$/i.test(qs.get('f') || '') ? qs.get('f') : ''; // ссылка сразу на файл
const tripUrl = id => location.origin + location.pathname + '?t=' + id;
const tgUrl = id => BOT ? `https://t.me/${BOT}?startapp=${id}` : tripUrl(id);
const knownTrips = () => { try { return JSON.parse(ls.get('trips-known')) || []; } catch { return []; } };
function saveKnown(l) { const s = JSON.stringify(l.slice(0, 30)); ls.set('trips-known', s); try { cloud?.setItem('trips', s); } catch {} }
function rememberTrip(id, title, dates) {
  if (!TRIP_RE.test(id)) return;
  const l = knownTrips().filter(x => x.id !== id); l.unshift({ id, title: title || 'Поездка', dates: dates || '', at: Date.now() });
  saveKnown(l); ls.set('trip-last', id);
}
function forgetTrip(id) { saveKnown(knownTrips().filter(x => x.id !== id)); if (ls.get('trip-last') === id) ls.set('trip-last', ''); }
function syncCloudTrips() {
  return new Promise(ok => { if (!cloud) return ok();
    try { cloud.getItem('trips', (e, v) => { try { if (!e && v) { const m = new Map(); [...JSON.parse(v), ...knownTrips()].forEach(x => { const o = m.get(x.id); if (!o || (x.at || 0) > (o.at || 0)) m.set(x.id, x); }); ls.set('trips-known', JSON.stringify([...m.values()].sort((a, b) => (b.at || 0) - (a.at || 0)))); } } catch {} ok(); }); } catch { ok(); } });
}
function newTripId() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', b = crypto.getRandomValues(new Uint8Array(22)); return [...b].map(x => a[x % a.length]).join(''); }
const goTrip = id => { location.href = location.pathname + (id ? '?t=' + id : '?home=1'); };

function parseCoords(s) {
  if (!s) return null; s = String(s).trim();
  const m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/) ||
            s.match(/^(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)$/);
  if (!m) return null; const lat = +m[1], lng = +m[2];
  return (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) ? { lat, lng } : null;
}
function mapsUrl(it) {
  if (it.lat != null && it.lng != null) return `https://www.google.com/maps/search/?api=1&query=${it.lat},${it.lng}`;
  if (it.mapUrl) return it.mapUrl;
  const q = it.address || (it.name && it.city ? `${it.name}, ${it.city}` : '');
  return q ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}` : null;
}

/* ---------------- people ---------------- */
const PCOL = ['#ff6b4a','#7b5cff','#13a89e','#f5a524','#e2479a','#3b82f6','#16a34a','#a855f7'];
const people = () => data.meta?.people?.length ? data.meta.people : (CFG.people || []);
const pColor = p => { const i = people().indexOf(p); if (i >= 0) return PCOL[i % PCOL.length]; let h = 0; for (const c of String(p)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PCOL[h % PCOL.length]; };
const av = p => `<span class="av" style="--c:${pColor(p)}" title="${esc(p)}">${esc((p || '?')[0].toUpperCase())}</span>`;
const avs = (w, max = 5) => (w && w.length) ? `<span class="avs">${w.slice(0, max).map(av).join('')}</span>${w.length > max ? ` <span class="muted">+${w.length - max}</span>` : ''}` : `<span class="who-all">для всех</span>`;
const ALIAS = { nikita:'Никита', diana:'Диана', stas:'Стас', stanislav:'Стас', marina:'Марина', frolov:'Фролов' };
function guessMe() {
  const u = tg?.initDataUnsafe?.user; if (!u) return '';
  for (const n of [u.first_name, u.last_name, u.username].filter(Boolean)) {
    const l = n.toLowerCase();
    const p = people().find(x => x.toLowerCase() === l) || people().find(x => x === ALIAS[l]);
    if (p) return p;
  }
  return '';
}
const ME_KEY = 'trip-me-' + (TRIP || 'none');
let me = ls.get(ME_KEY) || '';
let view = ls.get('trip-view') || 'mine';
const isMine = it => !it.who || !it.who.length || it.who.includes(me);
const visible = it => view === 'all' || !me || isMine(it);
const author = () => me || tg?.initDataUnsafe?.user?.first_name || '';

/* ---------------- schemas ---------------- */
const TYPES = { plane:['✈️','Самолёт'], train:['🚆','Поезд'], ferry:['⛴️','Паром'], bus:['🚌','Автобус'], transfer:['🚐','Трансфер'], other:['🚕','Другое'] };
const CATS = { see:['🏛','Посмотреть'], food:['🍜','Еда'], beach:['🏖','Пляж'], active:['🤿','Активность'], shop:['🛍','Шоппинг'], night:['🍹','Вечер'], other:['📍','Другое'] };
const STATUS = { booked:'✅ Забронировано', todo:'🔎 Нужно забронировать' };
const PAID = { paid:'Оплачено', part:'Частично', onsite:'Оплата на месте', none:'Не оплачено' };
const FLAGS = { 'Казахстан':'🇰🇿','Таиланд':'🇹🇭','Индонезия':'🇮🇩','Вьетнам':'🇻🇳','Малайзия':'🇲🇾','Россия':'🇷🇺','Камбоджа':'🇰🇭','Лаос':'🇱🇦','Сингапур':'🇸🇬','Филиппины':'🇵🇭','Шри-Ланка':'🇱🇰','Китай':'🇨🇳','Япония':'🇯🇵' };
const CCOL = ['#ff6b4a','#f5a524','#13a89e','#3b82f6','#7b5cff','#e2479a','#16a34a','#0ea5e9','#a855f7'];
const opts = o => Object.entries(o).map(([k, v]) => [k, Array.isArray(v) ? v.join(' ') : v]);
const cityNames = () => [...new Set(stopsSorted().map(s => s.city))];
const cityOpts = () => [['', '— Общее —'], ...cityNames().map(c => [c, c])];

const SCHEMA = {
  stops: { title: 'Город маршрута', fields: [
    ['city','Город','text',{req:1, ph:'Бангкок'}], ['country','Страна','text',{ph:'Таиланд'}],
    ['who','Кто едет','people',{allDefault:1}],
    ['coords','Координаты или ссылка на карту','coords',{adv:1}], ['notes','Заметки','textarea',{adv:1}] ]},
  stays: { title: 'Жильё', fields: [
    ['status','','chips',{options:[['booked','✅ Забронировано'],['todo','🔎 Ищем']]}],
    ['name','Название','text',{req:1, ph:'Например: Airbnb у пляжа'}], ['city','Город','select',{options:cityOpts}],
    [['checkin','Заезд','date'],['checkout','Выезд','date']],
    ['link','Ссылка (Booking, Airbnb…)','url'],
    ['files','Скрин или PDF брони','file'],
    ['address','Адрес','text',{adv:1}], ['coords','Координаты или ссылка на карту','coords',{adv:1}],
    ['confirmation','Номер брони / PIN','text',{adv:1}],
    [['price','Цена','text',{ph:'12 000 ₽',adv:1}],['paid','Оплата','select',{options:opts(PAID),adv:1}]],
    ['phone','Телефон хоста','text',{adv:1}], ['who','Кто живёт (никто не выбран = все)','people',{adv:1}], ['notes','Заметки','textarea',{adv:1}] ]},
  transport: { title: 'Билет', fields: [
    ['status','','chips',{options:[['booked','✅ Билет есть'],['todo','🔎 Ещё не купили']]}],
    ['type','','chips',{options:opts(TYPES)}],
    [['from','Откуда','text',{req:1, ph:'Москва'}],['to','Куда','text',{req:1, ph:'Бангкок'}]],
    ['depart','Отправление','datetime'],
    ['who','Чей билет','people'],
    ['files','Скрин или PDF билета','file'],
    ['arrive','Прибытие','datetime',{adv:1}],
    [['number','Рейс / номер','text',{ph:'SU 270',adv:1}],['carrier','Перевозчик','text',{adv:1}]],
    ['confirmation','Код брони / PNR','text',{adv:1}], ['link','Ссылка на билет','url',{adv:1}],
    [['price','Цена','text',{adv:1}],['seats','Места / багаж','text',{adv:1}]],
    ['notes','Заметки','textarea',{adv:1}] ]},
  places: { title: 'Место', fields: [

/* ---------------- data / storage ---------------- */
const CACHE = 'trip-cache-' + (TRIP || 'none');
let data = { meta: {} };
let mode = 'local', online = false, fb = null, fbStarted = false;
setTimeout(() => { fbStarted = true; if (TRIP && !document.body.classList.contains('homing')) try { render(); } catch {} }, 2500); // не пугаем баннером, пока идёт подключение
const SEED_V = 2;
function seedData() { return { meta: { title:'Поездка', start:'', end:'', people: CFG.people || [], seed: SEED_V } }; }
function clean(o) { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== undefined && v !== '' && v !== null && k !== 'id') r[k] = v; return r; }

function loadCache() { try { return JSON.parse(ls.get(CACHE)); } catch { return null; } }

/* Правки без сети: Firebase держит их в памяти, пока приложение открыто. Чтобы они не пропали,
   если приложение закроют, дублируем их в очередь на устройстве и досылаем при следующем запуске. */
const PQ = 'trip-pending-' + (TRIP || 'none');
const pq = () => { try { return JSON.parse(ls.get(PQ)) || {}; } catch { return {}; } };
const DEL = { __del: 1 };
function fbWrite(path, val) {
  const q = pq(), v = val === null ? DEL : val; q[path] = v; ls.set(PQ, JSON.stringify(q));
  const done = () => { const q2 = pq(); if (JSON.stringify(q2[path]) === JSON.stringify(v)) { delete q2[path]; ls.set(PQ, JSON.stringify(q2)); } };
  const ref = fb.ref(fb.db, `${fb.root}/${path}`);
  return (val === null ? fb.remove(ref) : fb.set(ref, val)).then(done, e => { done(); toast('Ошибка сохранения: ' + (e.code || e.message)); });
}
function replayPending() { const q = pq(); Object.entries(q).forEach(([p, v]) => fbWrite(p, v.__del ? null : v)); return Object.keys(q).length; }
const pendingCount = () => Object.keys(pq()).length;

async function put(sec, id, item) {
  item = clean({ ...item, updatedAt: Date.now(), updatedBy: author() || undefined });
  logItem(sec, id, data[sec]?.[id], item);
  if (mode === 'fb') return fbWrite(`${sec}/${id}`, item);
  (data[sec] ||= {})[id] = item; saveCache(); render();
}
async function del(sec, id) {
  logItem(sec, id, data[sec]?.[id], null);
  if (mode === 'fb') return fbWrite(`${sec}/${id}`, null);
  delete data[sec]?.[id]; saveCache(); render();
}
async function putMeta(meta) {
  logItem('meta', 'meta', data.meta, clean(meta));
  if (mode === 'fb') return fbWrite('meta', clean(meta));
  data.meta = meta; saveCache(); render();
}
const SECS = ['meta','stops','stays','transport','places','notes','todo','options','expenses'];

/* ---------------- журнал изменений ----------------
   Все записи одного действия (например, «Сохранить» в редакторе маршрута) собираются в одну запись журнала.
   В записи хранится прежнее состояние каждой изменённой вещи, поэтому её можно вернуть как было. */
const SEC_L = { stops: 'Город', stays: 'Жильё', transport: 'Билет', places: 'Место', notes: 'Заметка', todo: 'Дело', options: 'Вариант', meta: 'Поездка', expenses: 'Расходы' };
const FL = { city: 'город', country: 'страна', from: 'приезд', to: 'отъезд', who: 'кто', checkin: 'заезд', checkout: 'выезд', status: 'статус', name: 'название',
  link: 'ссылка', address: 'адрес', confirmation: 'бронь', price: 'цена', paid: 'оплачено', phone: 'телефон', notes: 'заметки', type: 'тип', depart: 'отправление',
  arrive: 'прибытие', number: 'рейс', carrier: 'перевозчик', seats: 'места', pnrs: 'коды брони', files: 'файлы', lat: 'координаты', mapUrl: 'карта', text: 'текст',
  url: 'ссылка', day: 'день', time: 'время', cat: 'категория', done: 'сделано', title: 'название', start: 'начало', end: 'конец', people: 'участники', note: 'комментарий',
  payer: 'кто платил', recv: 'кому', ppl: 'за кого', amount: 'сумма', cur: 'валюта', rate: 'курс', split: 'как делим', parts: 'доли', date: 'дата', kind: 'вид', money: 'расходы' };
let logKind = '', logQ = null, logNew = 0;
const logMine = new Map();   // записи, сделанные в этой сессии (видны в журнале сразу, даже без сети)
const itemTitle = (sec, x) => { if (!x) return '';
  if (sec === 'stops') return x.city || '';
  if (sec === 'stays') return x.name || ('жильё ' + (x.city || ''));
  if (sec === 'transport') return `${cityOfPt(x.from)} → ${cityOfPt(x.to)}${x.depart ? ', ' + fmtD(x.depart) : ''}`;
  if (sec === 'places') return x.name || '';
  if (sec === 'options') return host(x.url);
  if (sec === 'meta') return x.title || 'Поездка';
  if (sec === 'expenses') return expTitle(x);
  return String(x.text || '').slice(0, 50); };
const sameV = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
function logItem(sec, id, prev, next) {
  if (!TRIP) return;
  prev = prev ? clean({ ...prev }) : null;
  const ch = [];
  if (prev && next) for (const k of new Set([...Object.keys(prev), ...Object.keys(next)])) {
    if (!(k in FL) || k === 'lng' || sameV(prev[k], next[k])) continue;
    if (k === 'who' && sameV([...(prev.who || [])].sort(), [...(next.who || [])].sort())) continue;
    ch.push([k, prev[k] ?? null, next[k] ?? null]);
  }
  if (prev && next && !ch.length) return;      // ничего видимого не поменялось
  const it = { sec, id, op: !prev ? 'add' : !next ? 'del' : 'edit', t: itemTitle(sec, next || prev) };
  if (ch.length) it.ch = ch.slice(0, 8);
  if (prev && JSON.stringify(prev).length < 6000) it.prev = prev;
  if (!logQ) { logQ = { kind: logKind, items: [] }; setTimeout(flushLog, 0); }
  logQ.items.push(it);
}
function flushLog() {
  const q = logQ; logQ = null; logKind = '';
  if (!q?.items.length) return;
  const at = Date.now(), key = 'L' + String(at).padStart(14, '0') + Math.random().toString(36).slice(2, 6);
  const e = clean({ at, by: author() || undefined, kind: q.kind || undefined, items: q.items });
  logMine.set(key, e);
  if (mode === 'fb') fbWrite(`log/${key}`, JSON.parse(JSON.stringify(e)));
  else { (data.log ||= {})[key] = e; saveCache(); }
}
const withLog = (kind, fn) => { if (logQ && logQ.items.length) flushLog(); logKind = kind; try { fn(); } finally { if (logQ) logQ.kind = kind; else logKind = ''; } };
async function loadLog(n) {
  let got = {};
  if (mode === 'fb' && online) { try { const v = (await fb.get(fb.query(fb.ref(fb.db, `${fb.root}/log`), fb.orderByKey(), fb.limitToLast(n)))).val(); got = v || {}; } catch {} }
  if (mode !== 'fb') got = { ...(data.log || {}) };
  const all = { ...got }; logMine.forEach((e, k) => { all[k] ||= e; });
  return Object.entries(all).sort((a, b) => b[0].localeCompare(a[0])).slice(0, n).map(([k, e]) => ({ ...e, key: k }));
}
async function checkNewLog() {
  const seen = +(ls.get('trip-logseen-' + TRIP) || 0); if (!seen) { ls.set('trip-logseen-' + TRIP, Date.now()); return; }
  const l = await loadLog(40); logNew = l.filter(e => e.at > seen && e.by !== author()).length; if (logNew) render();
}

async function replaceAll(d) {
  if (mode === 'fb') return Promise.all(SECS.map(k => fb.set(fb.ref(fb.db, `${fb.root}/${k}`), d[k] ?? null)));
  data = d; saveCache(); render();
}
/* файлы (скрины билетов): сами данные лежат отдельно в files/, в карточке только описание */
function readAsDataURL(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); }); }
async function compressImage(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}
async function saveFile(f) {
  const isImg = /^image\//.test(f.type), isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  if (!isImg && !isPdf) throw new Error('Можно картинку или PDF');
  if (isPdf && f.size > 4e6) throw new Error('PDF больше 4 МБ');
  const dataUrl = isImg ? await compressImage(f) : await readAsDataURL(f);
  const id = uid(), meta = { name: f.name || 'file', type: isImg ? 'image/jpeg' : 'application/pdf', by: author() || undefined, at: Date.now() };
  if (mode === 'fb') { if (!online) throw new Error('Нет сети. Скрин можно будет прикрепить, когда появится связь'); await fb.set(fb.ref(fb.db, `${fb.root}/files/${id}`), { data: dataUrl, ...clean(meta) }); fileCachePut(id, { data: dataUrl, ...meta }); }
  else (data.files ||= {})[id] = { data: dataUrl, ...meta };
  return [id, clean(meta)];
}
/* скрины и PDF билетов храним на устройстве (Cache API): файлы не меняются, id уникальные */
const FCACHE = 'files-' + (TRIP || 'none');
async function fileCacheGet(id) { try { const m = await (await caches.open(FCACHE)).match('__f/' + id); return m ? await m.json() : null; } catch { return null; } }
async function fileCachePut(id, f) { try { await (await caches.open(FCACHE)).put('__f/' + id, new Response(JSON.stringify(f), { headers: { 'content-type': 'application/json' } })); } catch {} }
async function prefetchFiles() {
  if (mode !== 'fb' || !online || prefetchFiles._busy) return; prefetchFiles._busy = 1;
  try {
    const ids = [...list('transport'), ...list('stays'), ...list('expenses')].flatMap(x => Object.keys(x.files || {}));
    for (const id of ids) { if (!online) break; if (await fileCacheGet(id)) continue;
      const f = (await fb.get(fb.ref(fb.db, `${fb.root}/files/${id}`)).catch(() => null))?.val(); if (f) await fileCachePut(id, f); }
    const hasPdf = [...list('transport'), ...list('stays'), ...list('expenses')].some(x => Object.values(x.files || {}).some(m => m.type?.includes('pdf')));
    // библиотеку для PDF запрашиваем тем же способом (no-cors), каким её потом грузит страница
    if (hasPdf && online && ls.get('trip-pdfjs') !== PDFJS) { const r = await Promise.all(PDFJS_FILES.map(u => fetch(u, { mode: 'no-cors' }).then(() => true, () => false))); if (r.every(Boolean)) ls.set('trip-pdfjs', PDFJS); }
  } finally { prefetchFiles._busy = 0; }
}
async function getFile(id) {
  if (CFG.firebase && TRIP) { const c = await fileCacheGet(id); if (c) return c;
    let f = null;
    if (mode === 'fb' && online) f = (await fb.get(fb.ref(fb.db, `${fb.root}/files/${id}`)).catch(() => null))?.val();
    // база ещё не подключилась (страницу только что открыли по ссылке на файл): берём файл обычным запросом
    if (!f && navigator.onLine !== false) f = await fetch(`${CFG.firebase.databaseURL}/trips/${TRIP}/files/${id}.json`).then(r => r.ok ? r.json() : null).catch(() => null);
    if (f) fileCachePut(id, f); return f; }
  return data.files?.[id];
}
function removeFile(id) { if (mode === 'fb') { fbWrite(`files/${id}`, null); caches.open(FCACHE).then(c => c.delete('__f/' + id)).catch(() => {}); } else delete data.files?.[id]; }

async function loadFb() {
  const v = '10.12.2';
  const [{ initializeApp }, dbm] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`)]);
  return { db: dbm.getDatabase(initializeApp(CFG.firebase)), dbm };
}
async function initStore() {
  if (!TRIP) { await syncCloudTrips(); return renderHome(); }
  const cached = loadCache();
  if (cached) data = cached;
  // ссылка сразу на файл: показываем его, не дожидаясь подключения базы
  if (FILE_Q) { history.replaceState(null, '', location.pathname + '?t=' + TRIP); openFile(FILE_Q, { auto: qs.has('dl') }); }
  if (CFG.firebase) {
    try {
      const { db, dbm } = await loadFb();
      fb = { db, ref: dbm.ref, set: dbm.set, get: dbm.get, remove: dbm.remove, query: dbm.query, orderByKey: dbm.orderByKey, limitToLast: dbm.limitToLast, root: `trips/${TRIP}` };
      mode = 'fb'; delete data.files;
      dbm.onValue(dbm.ref(db, '.info/connected'), s => { const was = online; online = !!s.val(); render(); if (online && !was) setTimeout(prefetchFiles, 1500); });
      if (replayPending()) toast('Отправляю правки, сделанные без сети');
      let raf = 0; const loaded = new Set();
      for (const sec of SECS) dbm.onValue(dbm.ref(db, `${fb.root}/${sec}`), snap => {
        data[sec] = snap.val() || (sec === 'meta' ? null : {});
        if (sec === 'meta' && !data.meta) { forgetTrip(TRIP); ls.set(CACHE, ''); syncCloudTrips().then(() => renderHome('Поездка по этой ссылке не найдена. Может, ссылка обрезалась? Попроси прислать её ещё раз.')); return; }
        if (sec === 'meta') rememberTrip(TRIP, data.meta.title, data.meta.start ? `${fmtD(data.meta.start)} — ${fmtD(data.meta.end)}` : '');
        loaded.add(sec);
        clearTimeout(raf); raf = setTimeout(() => { saveCache(); render(); if (loaded.size === SECS.length) { askMeOnce(); if (!prefetchFiles._t) { prefetchFiles._t = setTimeout(prefetchFiles, 1500); setTimeout(checkNewLog, 2500); }; } }, 10);
      }, err => toast('Нет доступа к базе: ' + err.code));
    } catch (e) { console.error(e); toast('Нет связи, показываю сохранённое'); }
  } else if (!cached) { data = seedData(); saveCache(); }
  if (!data.meta) data.meta = seedData().meta;
  render(); if (cached) askMeOnce();
  if (mode !== 'fb') setTimeout(checkNewLog, 500);
  loadFx().then(ok => { if (ok && tab === 'money') render(); });
  if (qs.has('invite')) { history.replaceState(null, '', location.pathname + '?t=' + TRIP); setTimeout(openInvite, 600); }
}

  if (mode === 'fb' && !online) h += `<div class="banner off">📴 Нет сети: видны только изменения с этого телефона</div>`;

}

/* --- по дням --- */
function renderDays() {
  const { start, end } = tripRange();
  if (!start) return $('#tab-days').innerHTML = `<div class="empty"><b>🗓</b>Укажите даты поездки</div>`;
  const evs = {}; const add = (d, e) => { if (d) (evs[d] ||= []).push(e); };
  mergeLegs(list('transport').filter(visible)).forEach(t => add(t.depart?.slice(0,10), { o:1, time: fmtT(t.depart), sec:'transport', it:t }));
  list('stays').filter(visible).forEach(s => { add(s.checkout, { o:0, sec:'stays', it:s, kind:'out' }); add(s.checkin, { o:3, sec:'stays', it:s, kind:'in' }); });
  list('places').forEach(p => add(p.day, { o:2, time: p.time || '', sec:'places', it:p }));
  const stops = stopsSorted(), stays = list('stays').filter(visible), trs = list('transport').filter(visible);
  let first = start, last = end || start;
  Object.keys(evs).forEach(k => { if (k < first) first = k; if (k > last) last = k; });
  const t = todayKey(); let h = '';
  for (let d = first, i = 0; d <= last && i < 150; d = addDays(d, 1), i++) {
    const dst = stops.filter(s => s.from && s.from <= d && (!s.to || d <= s.to) && (!mineOnly() || stopPpl(s).includes(me)));
    const stop = dst[dst.length - 1];
    // параллельные ветки в этот день: по одному (последнему) городу на каждую группу
    const par = dst.filter(s => !dst.some(o => o !== s && o.from > s.from && !disj(o, s)));
    const split = par.length > 1 && par.some(a => par.some(b => a !== b && disj(a, b)));
    const night = stays.find(s => s.checkin && s.checkout && s.checkin <= d && d < s.checkout);
    const lst = (evs[d] || []).sort((a, b) => a.o - b.o || (a.time || '99').localeCompare(b.time || '99'));
    const dd = toD(d), sc = stop ? cityColor(stop.city) : 'var(--hint)';
    h += `<div class="day ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}" id="day-${d}">
      <div class="day-h"><div class="dnum"><b>${dd.getDate()}</b><span>${MON[dd.getMonth()]} ${WD[dd.getDay()]}</span></div>
      <div class="day-city">${split ? `<span class="dpar">${par.map(s => `<span><span style="color:${cityColor(s.city)}">●</span> ${esc(s.city)} ${avs(stopPpl(s), 4)}</span>`).join('')}</span>` : (stop ? `<span style="color:${sc}">●</span> ${esc(stop.city)}${dst.filter(x => x !== stop && x.from === x.to).map(x => ` <span class="muted">· ☀ ${esc(x.city)}</span>`).join('')}` : '')} <span class="muted">· день ${daysBetween(start, d) + 1}</span></div></div>`;
    for (const e of lst) h += evRow(e);
    if (d < last && split) {
      par.forEach(s => { const ns = stays.find(x => stayInStop(x, s) && x.checkin && x.checkout && x.checkin <= d && d < x.checkout);
        h += !ns ? `<div class="night warn">⚠️ ${esc(s.city)}: где ночуем — не указано</div>` : ns.status === 'todo' ? `<div class="night warn" data-edit="stays:${ns.id}">🔎 ${esc(s.city)}: жильё не забронировано</div>` : `<div class="night">🛏 ${esc(s.city)}: ${esc(ns.name)}</div>`; });
    } else if (d < last) {
      if (night) h += night.status === 'todo' ? `<div class="night warn" data-edit="stays:${night.id}">🔎 Ночь: ${esc(night.city || '')}, жильё не забронировано</div>` : `<div class="night">🛏 ${esc(night.name)}</div>`;
      else if (trs.some(x => x.depart?.slice(0,10) <= d && x.arrive?.slice(0,10) > d)) h += `<div class="night">🌙 Ночь в дороге</div>`;
      else h += `<div class="night warn">⚠️ Где ночуем — не указано</div>`;
    }
    h += `</div>`;
  }
  $('#tab-days').innerHTML = h;
  if (!renderDays._s && t >= first && t <= last) { renderDays._s = 1; setTimeout(() => document.getElementById('day-' + t)?.scrollIntoView({ block: 'start' }), 60); }

let map, layer;
function renderMap() {
  if (!window.L) { $('#map').innerHTML = '<div class="empty">Карта не загрузилась</div>'; return; }
  if (!map) {
    map = L.map('map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 60);
  layer.clearLayers();
  const pts = [];
  const pin = (lat, lng, html, pop) => { layer.addLayer(L.marker([lat, lng], { icon: L.divIcon({ className: '', html, iconSize: [26, 26], iconAnchor: [13, 13] }) }).bindPopup(pop)); pts.push([lat, lng]); };
  const stops = stopsSorted().filter(s => s.lat != null);
  for (const b of stops) for (const a of prevStops(b).filter(x => x.lat != null)) {
    layer.addLayer(L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: '#ff4f8b', weight: 3, opacity: .75, dashArray: '8 6' }));
    const mid = [(a.lat + b.lat) / 2, (a.lng + b.lng) / 2];
    const ang = Math.atan2(b.lat - a.lat, b.lng - a.lng) * 180 / Math.PI;
    layer.addLayer(L.marker(mid, { interactive: false, icon: L.divIcon({ className: '', html: `<div class="arrow" style="transform:rotate(${-ang}deg)">➤</div>`, iconSize: [18, 18], iconAnchor: [9, 9] }) }));
  }
  stops.forEach(s => { const i = stopsSorted().findIndex(x => x.id === s.id); pin(s.lat, s.lng, `<div style="width:26px;height:26px;border-radius:50%;background:${CCOL[i % CCOL.length]};color:#fff;display:grid;place-items:center;font:700 13px sans-serif;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.35)">${i + 1}</div>`,
    `<b>${esc(s.city)}</b><br>${fmtD(s.from)} — ${fmtD(s.to)}<br><a href="#" data-city="${s.id}">Подробнее</a>`); });
  list('stays').filter(s => s.lat != null && visible(s)).forEach(s => pin(s.lat, s.lng, '<div class="pin">🏨</div>', `<b>${esc(s.name)}</b><br><a class="ext" href="${mapsUrl(s)}" target="_blank">Google Maps</a> · <a href="#" data-edit="stays:${s.id}">Изменить</a>`));
  list('places').filter(p => p.lat != null).forEach(p => pin(p.lat, p.lng, `<div class="pin">${p.done ? '✅' : (CATS[p.cat] || CATS.other)[0]}</div>`, `<b>${esc(p.name)}</b><br><a class="ext" href="${mapsUrl(p)}" target="_blank">Google Maps</a> · <a href="#" data-edit="places:${p.id}">Изменить</a>`));
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 }); else map.setView([13.75, 100.5], 4);
}

(() => {   // потянуть шторку вниз, чтобы закрыть
  const sh = $('#sheet'), inn = $('#sheetIn'), bg = $('#sheetBg');
  let y0 = null, x0 = 0, dy = 0, t0 = 0, mode = null, grab = false;
  const start = (x, y, target) => { grab = !!target.closest('#sheetGrab'); mode = null; dy = 0; t0 = Date.now(); x0 = x;
    y0 = grab || (inn.scrollTop <= 0 && !target.closest('input,textarea,select,.leaflet-container,.hscroll')) ? y : null; };
  const move = (x, y, e) => { if (y0 == null) return;
    const d = y - y0;
    if (!mode) { if (Math.abs(d) < 7 && Math.abs(x - x0) < 7) return; mode = d > 0 && Math.abs(d) > Math.abs(x - x0) && (grab || inn.scrollTop <= 0) ? 'drag' : 'pass'; if (mode === 'drag') sh.classList.add('dragging'); }
    if (mode !== 'drag') return;
    if (e.cancelable) e.preventDefault();
    dy = Math.max(0, d); sh.style.transform = `translateY(${dy}px)`; bg.style.opacity = String(Math.max(.25, 1 - dy / (sh.offsetHeight || 1))); };
  const end = () => { if (mode === 'drag') { const fast = dy / Math.max(1, Date.now() - t0) > .6 && dy > 70; sh.classList.remove('dragging');
      if (dy > Math.min(140, sh.offsetHeight * .3) || fast) dismissSheet(); else { sh.style.transform = ''; bg.style.opacity = ''; } }
    y0 = null; mode = null; };
  sh.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive: true });
  sh.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
  $('#sheetGrab').addEventListener('mousedown', e => { start(e.clientX, e.clientY, e.target); const mm = ev => move(ev.clientX, ev.clientY, ev), mu = () => { end(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); }; addEventListener('mousemove', mm); addEventListener('mouseup', mu); });
})();

function fieldHtml(f, it) {
  const [name, label, type, o = {}] = f;
  let v = it[name] ?? '';
  if (type === 'coords') v = it.lat != null ? `${it.lat}, ${it.lng}` : (it.mapUrl || '');
  const id = 'f_' + name; let input;
  if (type === 'textarea') input = `<textarea id="${id}" name="${name}">${esc(v)}</textarea>`;
  else if (type === 'select') {
    let op = typeof o.options === 'function' ? o.options() : o.options;
    if (v && !op.some(([k]) => k === v)) op = [...op, [v, v]];
    input = `<select id="${id}" name="${name}">${op[0]?.[0] === '' ? '' : '<option value=""></option>'}${op.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  }
  else if (type === 'chips') {
    const op = typeof o.options === 'function' ? o.options() : o.options;
    return `<div class="pp" style="margin-bottom:12px">${op.map(([k, l]) => `<label><input type="radio" name="${name}" value="${esc(k)}" ${k === v ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div>`;
  }
  else if (type === 'datetime') {
    input = `<div class="two"><input type="date" name="${name}__d" value="${esc(String(v).slice(0, 10))}"><input type="time" name="${name}__t" value="${esc(fmtT(v))}"></div>`;
  }
  else if (type === 'file') {
    const fl = Object.entries(it.files || {});

      <label class="drop">📎 Прикрепить скрин или PDF<small>можно несколько; билет сразу засчитается</small><input type="file" name="${name}" accept="image/*,application/pdf" multiple hidden></label><div class="hint-s" data-fpick></div>`;
  }
  else if (type === 'people') {

  } else {

    if (type === 'coords') input += `<div class="hint-s">Google Maps: долгий тап по точке → скопировать координаты, или «Поделиться» → ссылка. <a href="#" data-geo="${id}">📍 Я здесь</a></div>`;

}
function openForm(sec, id, preset = {}) {

  const sc = SCHEMA[sec];
  const it = id ? { ...(data[sec]?.[id] || {}) } : { ...preset };
  if (sec === 'transport') { it.type ||= 'plane'; it.status ||= 'booked'; }
  if (sec === 'stays') it.status ||= 'booked';

  const adv = advF.length ? `<details class="adv" ${advFilled ? 'open' : ''}><summary>Подробнее (необязательно) ▾</summary>${advF.map(fh).join('')}</details>` : '';

  openSheet(`<form id="itemForm"><h2>${id ? '' : 'Новое: '}${esc(sc.title)}</h2>${basic}${adv}
    <div class="actions">${id && sec !== 'stops' ? '<button type="button" class="btn del" id="delBtn">Удалить</button>' : ''}<button type="button" class="btn" id="cancelBtn">Отмена</button><button class="btn pri" id="saveBtn">Сохранить</button></div>${meta}</form>`);
  const form = $('#itemForm');
  $('#cancelBtn').onclick = closeSheet;
  if (sec === 'stops') form.querySelector('h2').insertAdjacentHTML('afterend', `<div class="muted" style="margin:-6px 0 12px">${it.from === it.to ? fmtD(it.from) + ', на один день' : fmtD(it.from) + ' – ' + fmtD(it.to)} · <a href="#" data-reded="${id}">изменить даты и порядок</a></div>`);
  form.addEventListener('change', e => { if (e.target.type === 'file') { const n = e.target.files.length; form.querySelector('[data-fpick]').textContent = n ? `Выбрано файлов: ${n}. Нажмите «Сохранить»` : ''; const st = form.querySelector('input[name=status][value=booked]'); if (n && st) st.checked = true; } });
  if ($('#delBtn')) $('#delBtn').onclick = () => confirmBox('Удалить запись?', ok => { if (ok) { del(sec, id); closeSheet(); toast('Удалено. Вернуть можно в «🕘 Истории»'); } });
  form.onsubmit = async e => {
    e.preventDefault();
    const out = { ...it };
    for (const f of sc.fields.flatMap(f => Array.isArray(f[0]) ? f : [f])) {
      const [name, , type] = f;
      if (type === 'people') out.who = [...form.querySelectorAll('input[name=who]:checked')].map(x => x.value);
      else if (type === 'chips') out[name] = form.querySelector(`input[name=${name}]:checked`)?.value || '';

      } else out[name] = form.elements[name].value.trim();

    if (!id) { out.createdAt = Date.now(); if (sec === 'notes') out.author = author(); if (sec === 'options') out.by = author(); }
    put(sec, id || uid(), out); haptic('medium'); closeSheet(); toast('Сохранено');
  };
}
/* --- просмотр файлов (ваучеры, билеты, чеки) ---

  if (fvClick(e, T)) return;
  const fg = T.closest('[data-forget]'); if (fg) { e.stopPropagation(); forgetTrip(fg.dataset.forget); renderHome(); return; }
  const op = T.closest('[data-open]'); if (op) { goTrip(op.dataset.open); return; }
  if (T.closest('[data-newtrip]')) { openNewTrip(); return; }
  if (T.closest('[data-invite]')) { closeSheet(); setTimeout(openInvite, 250); return; }
  if (T.closest('[data-home]')) { goTrip(''); return; }
  if (T.closest('[data-openme]')) { e.preventDefault(); closeSheet(); setTimeout(() => openMe(false), 250); return; }
  if (moneyClick(e, T)) return;
  const a = T.closest('a.ext');
  if (a) { e.stopPropagation(); if (inTG) { e.preventDefault(); const u = a.href; /^https:\/\/t\.me\//.test(u) ? tg.openTelegramLink(u) : tg.openLink(u); } return; }
  if (T.closest('a[href^="tel:"]')) { e.stopPropagation(); return; }
  const cp = T.closest('[data-copy]'); if (cp) { e.stopPropagation(); navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('Скопировано: ' + cp.dataset.copy), () => toast(cp.dataset.copy)); haptic(); return; }
  const geo = T.closest('[data-geo]'); if (geo) { e.preventDefault(); navigator.geolocation?.getCurrentPosition(p => { $('#' + geo.dataset.geo).value = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`; }, () => toast('Не удалось получить геопозицию')); return; }
  const dn = T.closest('[data-done]'); if (dn) { e.stopPropagation(); const p = data.places[dn.dataset.done]; put('places', dn.dataset.done, { ...p, done: p.done ? undefined : true }); haptic(); return; }
  const td = T.closest('[data-todo]'); if (td) { const x = data.todo[td.dataset.todo]; put('todo', td.dataset.todo, { ...x, done: x.done ? undefined : true }); haptic(); return; }
  const dt = T.closest('[data-deltodo]'); if (dt) { const id = dt.dataset.deltodo; confirmBox('Удалить это дело?', ok => { if (ok) { del('todo', id); toast('Удалено'); } }); return; }
  const rv = T.closest('[data-rview]'); if (rv) { routeView = rv.dataset.rview; ls.set('trip-rview', routeView); haptic('soft'); renderRoute(); return; }
  const tt = T.closest('[data-tt]'); if (tt) { e.stopPropagation(); const i = +tt.dataset.tt, r = sumRows[i]; if (!r) return;
    if (!isMineMode() && tState(r) === 'part' && !pend.has('t|' + rowKey(r)) && !T.closest('.sx')) { if (openRow !== i) { openRow = i; render(); } haptic('soft'); toast('Билет не у всех: отметь ниже, у кого он есть'); return; }
    stage('t', r); return; }
  const stg = T.closest('[data-st]'); if (stg) { e.stopPropagation(); const r = sumRows[+stg.dataset.st]; if (r) stage('s', r); return; }
  if (T.closest('[data-log]')) { e.preventDefault(); closeSheet(); setTimeout(() => openLog(), 260); return; }
  const lfb = T.closest('[data-logf]'); if (lfb) { logF = lfb.dataset.logf; paintLog(); return; }
  if (T.closest('[data-logmore]')) { logN += 60; openLog(true); return; }
  const lu = T.closest('[data-logundo]'); if (lu) { logUndo(lu.dataset.logundo); return; }
  const lo = T.closest('[data-logopen]'); if (lo) { const [sec, id] = lo.dataset.logopen.split('|');
    if (sec === 'meta') return openMetaForm(); if (sec === 'expenses') return openExpense(id); if (sec === 'stops') { cityOpen = id; return openCity(id); }
    if (sec === 'options') { const o = data.options?.[id]; if (o) { const [ps, pid] = o.parent.split(':'); return openForm(ps, pid); } }
    return openForm(sec, id); }
  const re = T.closest('[data-reded]'); if (re) { e.preventDefault(); openRouteEd({ focus: re.dataset.reded || undefined }); return; }
  if (T.closest('[data-close]')) { closeSheet(); return; }
  const lv = T.closest('[data-leave]'); if (lv) { openLeave(lv.dataset.leave); return; }
  const ul = T.closest('[data-unleave]'); if (ul) { const [sid, ps] = ul.dataset.unleave.split('|'); const back = ps.split(','), s0 = data.stops[sid];
    stopsSorted().filter(o => o.from > s0.from).forEach(o => { if (o.who?.length) { const w = [...new Set([...o.who, ...back])]; put('stops', o.id, { ...data.stops[o.id], who: w.length >= people().length ? undefined : w }); } });
    openRow = null; toast(`${back.join(', ')} снова едут дальше`); return; }
  const mk = T.closest('[data-mark]'); if (mk) { e.stopPropagation(); const [k, idx, p] = mk.dataset.mark.split('|'); const r = sumRows[+idx]; if (r) stage('m' + k, r, p); return; }
  const sp = T.closest('[data-split]'); if (sp) { e.stopPropagation(); openSplit(sp.dataset.split); return; }
  const fl = T.closest('[data-file]'); if (fl) { e.preventDefault(); e.stopPropagation(); openFile(fl.dataset.file); return; }
  const jn = T.closest('[data-join]'); if (jn) { e.stopPropagation(); if (!me) return openMe(true); const t = data.transport[jn.dataset.join]; if (!t) return;
    const who = [...new Set([...(t.who || []), me])]; put('transport', jn.dataset.join, { ...t, who }); haptic('medium'); openMyTicket(jn.dataset.join, true); return; }
  const mt = T.closest('[data-myticket]'); if (mt) { e.stopPropagation(); openMyTicket(mt.dataset.myticket); return; }
  const lk = T.closest('[data-like]'); if (lk) { e.stopPropagation(); if (!me) return openMe(true); const p = lk.dataset.like; confirmBox(`Отметить тебя на всех билетах, которые есть у ${p}?`, ok => ok && joinLike(p)); return; }
  const js = T.closest('[data-joinstop]'); if (js) { if (!me) return openMe(true); openJoin(js.dataset.joinstop); return; }
  const rp = T.closest('[data-rmp]'); if (rp) { const p = rp.dataset.rmp; confirmBox(`Убрать ${p} из участников? Его билеты и заметки останутся.`, ok => { if (!ok) return; putMeta({ ...data.meta, people: people().filter(x => x !== p) }); if (me === p) { me = ''; ls.set(ME_KEY, ''); } setTimeout(() => openMe(false), 300); }); return; }
  const ao = T.closest('[data-addopt]'); if (ao) { e.stopPropagation(); openForm('options', null, { parent: ao.dataset.addopt }); return; }
  const eo = T.closest('[data-editopt]'); if (eo) { e.stopPropagation(); openForm('options', eo.dataset.editopt); return; }
  const pk = T.closest('[data-pick]'); if (pk) {
    e.stopPropagation(); const o = data.options[pk.dataset.pick]; const [sec, pid] = o.parent.split(':'); const par = data[sec]?.[pid]; if (!par) return;
    confirmBox('Этот вариант забронирован? Ссылка и цена перейдут в карточку.', ok => { if (!ok) return;
      put(sec, pid, { ...par, link: o.url, price: o.price || par.price, status: 'booked' }); del('options', pk.dataset.pick); toast('Отмечено как забронированное'); });
    return;
  }
  if (T.closest('[data-stop]') && !T.closest('a,button')) { e.stopPropagation(); return; }
  const mb = T.closest('[data-me]'); if (mb) { setMe(mb.dataset.me); return; }
  if (T.closest('[data-bookadd]')) { openForm(bookSeg === 'stays' ? 'stays' : 'transport', null, { status: 'booked', ...(bookSeg !== 'stays' && me && view === 'mine' ? { who: [me] } : {}) }); return; }
  const brw = T.closest('[data-brow]'); if (brw) { bookOpen = bookOpen === brw.dataset.brow ? null : brw.dataset.brow; ls.set('trip-bookhint', '1'); haptic('soft'); renderBook(); return; }
  const ast = T.closest('[data-addstay]'); if (ast) { const [city, checkin, checkout] = ast.dataset.addstay.split('|'); openForm('stays', null, { city, checkin, checkout, status: 'booked' }); return; }
  const al = T.closest('[data-addleg]'); if (al) { const [from, to, date] = al.dataset.addleg.split('|'); openForm('transport', null, { from, to, depart: date, status: 'booked', who: me && view === 'mine' ? [me] : [] }); return; }
  const rw = T.closest('[data-row]'); if (rw && !T.closest('button,a,input,form')) { const i = +rw.dataset.row; openRow = openRow === i ? null : i; haptic('soft'); renderRoute(); return; }
  const ed = T.closest('[data-edit]'); if (ed) { e.preventDefault(); const [sec, id] = ed.dataset.edit.split(':'); map?.closePopup(); openForm(sec, id); return; }
  const ct = T.closest('[data-city]'); if (ct) { e.preventDefault(); map?.closePopup(); cityOpen = ct.dataset.city; openCity(ct.dataset.city); return; }
  const ad = T.closest('[data-add]'); if (ad) { const sec = ad.dataset.add; const preset = {};
    if (ad.dataset.cityPreset) preset.city = ad.dataset.cityPreset;
    if (sec === 'transport' && me && view === 'mine') preset.who = [me];
    if (sec === 'places' && placeCity) preset.city ||= placeCity;
    if (sec === 'notes' && noteCity) preset.city ||= noteCity;
    if (sec === 'stays' || sec === 'transport') preset.status = 'booked';
    openForm(sec, null, preset); return; }
  if (T.closest('[data-meta]')) { openMetaForm(); return; }
  const gt = T.closest('[data-go]'); if (gt) { const [t, s] = gt.dataset.go.split(':'); if (s) bookSeg = s; if (t === 'notes') notesSeg = 'notes'; go(t); return; }
  const v = T.closest('[data-view]'); if (v) { if (pend.size && v.dataset.view !== view) return toast('Сначала сохрани или отмени отметки в сводке'); view = v.dataset.view; ls.set('trip-view', view); haptic(); render(); return; }
  const bs = T.closest('[data-bseg]'); if (bs) { bookSeg = bs.dataset.bseg; bookOpen = null; renderBook(); return; }
  const pv = T.closest('[data-pview]'); if (pv) { placesView = pv.dataset.pview; render(); return; }
  const pc = T.closest('[data-pcity]'); if (pc) { placeCity = pc.dataset.pcity; renderPlaces(); return; }
  const ns = T.closest('[data-nseg]'); if (ns) { notesSeg = ns.dataset.nseg; renderNotes(); return; }
  const nc = T.closest('[data-ncity]'); if (nc) { noteCity = nc.dataset.ncity; renderNotes(); return; }
  if (T.id === 'exp') { const b = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = `trip-${todayKey()}.json`; l.click(); return; }
  if (T.id === 'expCopy') { navigator.clipboard?.writeText(JSON.stringify(data)).then(() => toast('JSON скопирован')); return; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'expForm') { e.preventDefault(); document.activeElement?.blur?.(); return; }   // «Готово» на клавиатуре только прячет её
  if (f.id === 'mSetForm') { e.preventDefault(); moneySetSave(f); return; }
  if (f.matches('[data-composer]')) {
    e.preventDefault(); const text = f.elements.text.value.trim(); if (!text) return;
    if (!me) { openMe(true); return; }
    put('notes', uid(), { text, city: f.elements.city.value, author: author(), createdAt: Date.now() });
    f.elements.text.value = ''; haptic('medium'); toast('Опубликовано');
    if (cityOpen) { const id = cityOpen; setTimeout(() => openCity(id), 200); }
  }
  if (f.matches('[data-addp]')) { e.preventDefault(); const p = f.elements.p.value.trim(); if (!p) return; if (people().includes(p)) return toast('Уже есть');
    putMeta({ ...data.meta, people: [...people(), p] }); toast(`${p} добавлен(а)`); setTimeout(() => openMe(!me), 300); return; }
  if (f.matches('[data-stayopt]')) { e.preventDefault(); const u = normUrl(f.elements.url.value); if (!u) return toast('Не похоже на ссылку');
    let id = f.dataset.stayopt;
    if (!id) { const r = sumRows[+f.dataset.ri]; if (!r?.stop) return; id = uid(); put('stays', id, { status: 'todo', name: 'Жильё: ' + r.to, city: r.to, checkin: r.stop.from, checkout: r.stop.to, who: someoneOut(r) ? r.ppl : undefined, createdAt: Date.now() }); }
    put('options', uid(), { parent: 'stays:' + id, url: u, by: author() || undefined, createdAt: Date.now() }); haptic('medium'); toast('Вариант добавлен. Бронью он станет после «Берём»'); return; }
  if (f.matches('[data-staylink]')) { e.preventDefault(); const u = normUrl(f.elements.url.value); if (!u) return toast('Не похоже на ссылку');
    const id = f.dataset.staylink; put('stays', id, { ...data.stays[id], link: u }); haptic('medium'); toast('Ссылка на бронь сохранена'); return; }
  if (f.matches('[data-splitform]')) { e.preventDefault(); const id = f.dataset.splitform, st = data.stays[id], d = f.elements.d.value;
    if (!d || d <= st.checkin || d >= st.checkout) return toast('Дата должна быть внутри проживания');
    put('stays', id, { ...st, checkout: d });
    put('stays', uid(), { status: 'todo', name: f.elements.name.value.trim() || ('Жильё 2: ' + (st.city || '')), city: st.city, checkin: d, checkout: st.checkout, who: st.who, createdAt: Date.now() });
    closeSheet(); haptic('medium'); toast('Разделено на два жилья'); return; }
  if (f.matches('[data-joinlink]')) { e.preventDefault(); const v = f.elements.u.value.trim(), m = v.match(/(?:[?&](?:t|startapp)=)([A-Za-z0-9_-]{16,64})/) || v.match(/^([A-Za-z0-9_-]{16,64})$/);
    if (m) goTrip(m[1]); else toast('Не похоже на ссылку-приглашение'); return; }
  if (f.matches('[data-todoform]')) { e.preventDefault(); const v = f.elements.text.value.trim(); if (v) { put('todo', uid(), { text: v, createdAt: Date.now() }); f.elements.text.value = ''; } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'imp') { const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); confirmBox('Заменить все данные содержимым файла?', ok => { if (ok) { replaceAll(d); toast('Загружено'); } }); }).catch(() => toast('Файл не похож на JSON')); }
});
$('#nav').onclick = e => { const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); };
$('#meBtn').onclick = () => openMe(false);
$('#invBtn').onclick = () => openInvite();
$('#pendSave').onclick = savePend;
$('#pendCancel').onclick = () => { pend.clear(); render(); toast('Отметки отменены'); };
$('#fab').onclick = () => {
  if (tab === 'book') return openForm(bookSeg === 'stays' ? 'stays' : 'transport', null, { status: 'booked', ...(bookSeg !== 'stays' && me && view === 'mine' ? { who: [me] } : {}) });
  if (tab === 'places') return openForm('places', null, placeCity ? { city: placeCity } : {});
  if (tab === 'notes') { if (notesSeg === 'todo') return document.querySelector('[data-todoform] input')?.focus(); return document.querySelector('#tab-notes [data-composer] textarea')?.focus(); }
  addMenu();
};

initStore();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
